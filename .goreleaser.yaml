version: 2
project_name: testkube-ai-metrics-parser

before:
  hooks:
    - go mod tidy

builds:
  - id: testkube-ai-metrics-parser
    main: ./cmd/testkube-ai-metrics-parser
    binary: testkube-ai-metrics-parser
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  use: github

release:
  prerelease: auto
