name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"; echo "$unformatted"; exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  # Republish :latest on every merge to main. The README and the example
  # TestWorkflows all pull :latest, so without this they keep running whatever
  # was last pushed by hand until someone cuts a release.
  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Publish one at a time. This serializes pushes but does not order them, so
    # the tip check below is what actually keeps :latest correct.
    concurrency:
      group: publish-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # Two merges in quick succession are not guaranteed to reach this job in
      # commit order -- a slower test job can let the older commit arrive last
      # and overwrite :latest with code that main has already moved past. Only
      # publish while this commit is still the tip.
      - id: tip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not publishing $GITHUB_SHA: main has moved on to $tip, whose own run publishes instead."
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Match the 7-character sha that metadata-action puts in the image tag, so
      # `testkube-ai-metrics-parser version` names the tag it shipped in.
      - id: version
        run: echo "value=main-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/kubeshop/testkube-ai-metrics-parser
          tags: |
            type=raw,value=latest
            type=sha,prefix=main-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Still build a superseded commit, so the job reports whether it would
          # have built, but leave the tags pointing at the newer one.
          push: ${{ steps.tip.outputs.fresh == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
